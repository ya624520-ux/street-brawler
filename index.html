<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Street Brawler 2</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0b0b12; color: #eee; font-family: Arial, Helvetica, sans-serif; }
  #wrap { max-width: 980px; margin: 0 auto; padding: 8px; position: relative; }
  canvas { width: 100%; height: auto; display: block; background: #1a1030; border: 3px solid #ffcc44; border-radius: 6px; touch-action: none; }
  #pad { display: none; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #pad.on { display: flex; }
  .grp { display: flex; gap: 6px; flex: 1; }
  button, select, input { font-family: inherit; font-size: 14px; }
  button { flex: 1; min-width: 46px; padding: 11px 4px; font-weight: bold; color: #fff;
    background: linear-gradient(#444, #222); border: 2px solid #888; border-radius: 8px; touch-action: none; user-select: none; cursor: pointer; }
  button:active { background: linear-gradient(#ffcc44, #e09020); color: #111; }
  button.act { border-color: #ffcc44; }
  select, input { flex: 1; min-width: 90px; padding: 8px; background: #222; color: #fff; border: 2px solid #666; border-radius: 6px; }
  #hint { text-align: center; font-size: 12px; color: #aaa; margin-top: 8px; line-height: 1.5; }
  #menu { position: absolute; inset: 8px 8px auto 8px; padding: 18px; background: rgba(8,6,18,.92);
    border: 2px solid #ffcc44; border-radius: 8px; text-align: center; }
  #menu h1 { margin: 0 0 14px; font-size: 30px; letter-spacing: 3px; color: #ffcc44; text-shadow: 3px 3px #000; }
  .row { display: flex; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .row label { flex: 1; min-width: 130px; text-align: left; font-size: 12px; color: #ccc; display: flex; flex-direction: column; gap: 4px; }
  #setup, #online { margin-top: 12px; }
  #netMsg { font-size: 13px; color: #ffd86b; margin-top: 10px; min-height: 18px; word-break: break-all; white-space: pre-wrap; }
  #toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8);
    border: 2px solid #ffcc44; padding: 8px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 5; white-space: nowrap; }
  #mute { position: absolute; top: 14px; right: 14px; z-index: 6; max-width: 62px; padding: 6px; font-size: 11px; }
  #menuBtn { position: absolute; top: 14px; left: 14px; z-index: 6; max-width: 62px; padding: 6px; font-size: 11px; }
  #rosterPreview { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .fcard { flex: 1 1 88px; min-width: 82px; max-width: 128px; padding: 6px 4px; border: 2px solid #444;
    border-radius: 8px; background: rgba(0,0,0,.45); text-align: center; font-size: 10px; line-height: 1.35; }
  .fcard.sel1 { border-color: #ffcc44; box-shadow: 0 0 8px rgba(255,204,68,.7); }
  .fcard.sel2 { border-color: #5af0ff; box-shadow: 0 0 8px rgba(90,240,255,.7); }
  .fdot { width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; border: 2px solid #fff; }
  .fname { font-weight: bold; color: #fff; }
  .fstyle { color: #aaa; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <button id="menuBtn">MENU</button>
  <button id="mute">SOUND: ON</button>
  <div id="toast"></div>
  <div id="menu">
    <h1>STREET BRAWLER 2</h1>
    <div class="row">
      <button id="mSolo">SOLO VS AI</button>
      <button id="mLocal">LOCAL 2P</button>
      <button id="mOnline">ONLINE</button>
      <button id="m3d">3D VERSION</button>
    </div>
    <div id="setup" hidden>
      <div class="row">
        <label>P1 FIGHTER<select id="c1"></select></label>
        <label id="p2label">P2 FIGHTER<select id="c2"></select></label>
        <label>STAGE<select id="stageSel"></select></label>
        <label id="difflabel">DIFFICULTY<select id="diffSel"><option>EASY</option><option selected>NORMAL</option><option>HARD</option></select></label>
      </div>
      <div id="rosterPreview"></div>
      <div class="row"><button id="startBtn">START FIGHT</button><button id="backBtn">BACK</button></div>
    </div>
    <div id="online" hidden>
      <div class="row">
        <button id="hostBtn">HOST GAME</button>
        <input id="codeIn" placeholder="ROOM CODE" maxlength="6">
        <button id="joinBtn">JOIN</button>
      </div>
      <div class="row"><button id="copyBtn">COPY LINK</button><button id="netCancel">CANCEL</button><button id="netBack">BACK</button></div>
      <div id="netMsg"></div>
    </div>
  </div>
  <div id="pad">
    <div class="grp">
      <button data-k="a">&#9664;</button><button data-k="d">&#9654;</button>
      <button data-k="w">JUMP</button><button data-k="s">BLOCK</button>
    </div>
    <div class="grp">
      <button class="act" data-k="j">LP</button><button class="act" data-k="u">LK</button>
      <button class="act" data-k="k">HP</button><button class="act" data-k="i">HK</button>
      <button class="act" data-k="l">SP</button>
    </div>
  </div>
  <div id="hint">Gamepad: stick/D-pad move, A/B/X/Y attacks, R1/R2 special, Start menu (P1 = first pad, P2 = second). Keys: hold away to block; P1 A/D/W/S + J/U/K/I/L, P2 arrows + 1/2/3/4/5. Up+L uppercut, Down+L dive/fireball. K+L Rush / I+L Launcher (20 meter). M mute, Esc menu.</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 960, H = 540, GROUND = 448;
const CHARS = [
  { name: 'RED', style: 'BRAWLER', color: '#e74c3c', trim: '#ffd9d2', speed: 3.5, power: 1.0, durMod: 1, build: 1,
    fb: { dmg: 15, speed: 8.5, r: 17, color: '#6cf' }, upper: { invuln: 7, dmg: 18, kb: 9 }, dive: { dmg: 13, reach: 74 },
    rush: { dmg: 14, reach: 96, speed: 8 }, launcher: { dmg: 16, kb: 10 } },
  { name: 'BLUE', style: 'SPEEDSTER', color: '#3498db', trim: '#d6ecff', speed: 4.1, power: .85, durMod: .84, build: .86,
    fb: { dmg: 10, speed: 11, r: 13, color: '#8df' }, upper: { invuln: 10, dmg: 13, kb: 6 }, dive: { dmg: 12, reach: 86 },
    rush: { dmg: 11, reach: 104, speed: 10.5 }, launcher: { dmg: 13, kb: 7 } },
  { name: 'GREEN', style: 'HEAVYWEIGHT', color: '#2ecc71', trim: '#d9ffe8', speed: 2.9, power: 1.28, durMod: 1.12, build: 1.16,
    fb: { dmg: 19, speed: 6.5, r: 22, color: '#fd6' }, upper: { invuln: 4, dmg: 15, kb: 12 }, dive: { dmg: 16, reach: 66 },
    rush: { dmg: 19, reach: 84, speed: 6.5 }, launcher: { dmg: 21, kb: 14 } },
  { name: 'YELLOW', style: 'NINJA', color: '#f1c40f', trim: '#fff3bf', speed: 3.9, power: .92, durMod: .88, build: .9,
    fb: { dmg: 11, speed: 12, r: 12, color: '#ff5' }, upper: { invuln: 9, dmg: 14, kb: 6 }, dive: { dmg: 11, reach: 94 },
    rush: { dmg: 12, reach: 100, speed: 11 }, launcher: { dmg: 14, kb: 8 } },
  { name: 'PURPLE', style: 'GRAPPLER', color: '#9b59b6', trim: '#eadcf5', speed: 2.7, power: 1.35, durMod: 1.18, build: 1.22,
    fb: { dmg: 21, speed: 5.8, r: 24, color: '#c6f' }, upper: { invuln: 3, dmg: 20, kb: 13 }, dive: { dmg: 18, reach: 60 },
    rush: { dmg: 20, reach: 76, speed: 6 }, launcher: { dmg: 23, kb: 15 } }
];
const STAGES = ['ROOFTOP', 'NEON CITY', 'TEMPLE'];
const DIFFS = [
  { name: 'EASY', react: 22, aggro: .35, block: .18, combo: .08, anti: .1 },
  { name: 'NORMAL', react: 11, aggro: .58, block: .42, combo: .35, anti: .45 },
  { name: 'HARD', react: 5, aggro: .78, block: .68, combo: .72, anti: .85 }
];
const A = {
  lp:  { dur: 16, start: 3, end: 7, dmg: 5, reach: 70, stun: 13, kb: 2.5, pitch: 300, cancel: true, label: 'LP' },
  hp:  { dur: 27, start: 8, end: 14, dmg: 11, reach: 90, stun: 21, kb: 5.5, pitch: 210, label: 'HP' },
  lk:  { dur: 14, start: 3, end: 6, dmg: 4, reach: 64, stun: 11, kb: 2, pitch: 340, cancel: true, label: 'LK' },
  hk:  { dur: 31, start: 11, end: 19, dmg: 14, reach: 102, stun: 25, kb: 7, pitch: 150, label: 'HK' },
  clp: { dur: 13, start: 2, end: 6, dmg: 4, reach: 62, stun: 11, kb: 2, pitch: 320, cancel: true, low: true, label: 'CLP' },
  chp: { dur: 22, start: 6, end: 11, dmg: 9, reach: 80, stun: 19, kb: 4.5, pitch: 240, low: true, label: 'CHP' },
  sweep: { dur: 34, start: 10, end: 18, dmg: 12, reach: 110, stun: 30, kb: 8, pitch: 130, low: true, knock: true, label: 'SWEEP' },
  jlp: { dur: 18, start: 4, end: 10, dmg: 6, reach: 72, stun: 14, kb: 3, pitch: 300, air: true, label: 'JLP' },
  jhp: { dur: 24, start: 7, end: 14, dmg: 11, reach: 88, stun: 20, kb: 5, pitch: 190, air: true, label: 'JHP' },
  upper: { dur: 40, start: 5, end: 17, dmg: 18, reach: 66, stun: 32, kb: 9, pitch: 110, invuln: 7, special: true, label: 'UPPERCUT' },
  dive: { dur: 32, start: 6, end: 23, dmg: 13, reach: 74, stun: 24, kb: 6, pitch: 140, special: true, air: true, label: 'DIVE' },
  rush: { dur: 24, start: 5, end: 12, dmg: 14, reach: 96, stun: 22, kb: 7, pitch: 180, special: true, label: 'RUSH' },
  launcher: { dur: 36, start: 7, end: 16, dmg: 16, reach: 92, stun: 32, kb: 10, pitch: 110, special: true, label: 'LAUNCHER' }
};
const keys = {};
const padPrev = [{}, {}];
let padInputs = [null, null];
const padConnected = [false, false];
let audioCtx = null, muted = false, musicAcc = 0, musicStep = 0;
const bass = [55, 55, 82.4, 73.4, 55, 55, 98, 82.4];

function norm(e) { return e.key.toLowerCase(); }
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} } }
function tone(freq, dur, type, vol, delay) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime + (delay || 0);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || .05, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function sfx(name) {
  if (name === 'lp') tone(320, .06, 'square', .035);
  else if (name === 'hp') tone(180, .09, 'sawtooth', .05);
  else if (name === 'hit') { tone(140, .1, 'sawtooth', .07); tone(80, .14, 'square', .04, .02); }
  else if (name === 'block') tone(520, .06, 'sine', .05);
  else if (name === 'special') { tone(700, .16, 'sine', .06); tone(900, .12, 'square', .03, .05); }
  else if (name === 'jump') tone(380, .08, 'triangle', .03);
  else if (name === 'ko') { tone(110, .45, 'sawtooth', .09); tone(70, .6, 'square', .05, .08); }
  else if (name === 'bell') { tone(660, .18, 'sine', .06); tone(880, .22, 'sine', .04, .06); }
  else if (name === 'menu') tone(440, .06, 'square', .03);
}
function pollPads() {
  const res = [null, null];
  if (typeof navigator === 'undefined' || !navigator.getGamepads) return res;
  let pads = [];
  try { pads = navigator.getGamepads(); } catch (err) { return res; }
  let slot = 0;
  for (let i = 0; i < pads.length && slot < 2; i++) {
    const gp = pads[i];
    if (!gp) continue;
    const idx = slot++;
    const btn = n => !!(gp.buttons[n] && gp.buttons[n].pressed);
    const edge = n => {
      const pressed = btn(n);
      const rising = pressed && !padPrev[idx][n];
      padPrev[idx][n] = pressed;
      return rising;
    };
    const ax = gp.axes || [];
    const r1 = edge(5), rt = edge(7);
    res[idx] = {
      left: btn(12) || ax[0] < -.35,
      right: btn(14) || ax[0] > .35,
      up: btn(13) || ax[1] < -.35,
      down: btn(15) || ax[1] > .35,
      lp: edge(0), hp: edge(2), lk: edge(1), hk: edge(3), sp: r1 || rt,
      start: edge(9)
    };
    if (!padConnected[idx]) { padConnected[idx] = true; toast('Controller ' + (idx + 1) + ' connected'); }
  }
  for (let i = 0; i < 2; i++) {
    if (!res[i] && padConnected[i]) { padConnected[i] = false; toast('Controller ' + (i + 1) + ' disconnected'); }
  }
  return res;
}
function updateMusic() {
  if (!audioCtx || muted || phase === 'menu') return;
  musicAcc++;
  if (musicAcc >= 8) {
    musicAcc = 0;
    const f = bass[musicStep % bass.length];
    tone(f, .26, 'triangle', .022);
    if (musicStep % 2 === 0) tone(f * 4, .05, 'square', .01);
    musicStep++;
  }
}

addEventListener('keydown', e => {
  initAudio();
  const k = norm(e);
  keys[k] = true;
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
  if (k === 'm') { muted = !muted; document.getElementById('mute').textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON'); }
  if (k === 'escape' && phase !== 'menu') backToMenu();
  if (phase === 'over') {
    if (mode === 'online' && isHost) startMatch();
    else if (mode === 'online') send({ type: 'restart' });
    else startMatch();
  }
});
addEventListener('keyup', e => { keys[norm(e)] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio(); keys[k] = true;
    if (phase === 'over') { if (mode === 'online' && isHost) startMatch(); else if (mode === 'online') send({ type: 'restart' }); else startMatch(); }
  });
  const off = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
document.getElementById('mute').addEventListener('click', () => {
  initAudio(); muted = !muted; document.getElementById('mute').textContent = 'SOUND: ' + (muted ? 'OFF' : 'ON');
});
function backToMenu() {
  reconnecting = false;
  if (mode === 'online' && conn) {
    send({ type: 'bye' });
    setTimeout(() => { leaveNet(); }, 250);
  } else leaveNet();
  showMenu();
}
document.getElementById('menuBtn').addEventListener('click', () => { initAudio(); backToMenu(); });

const c1 = document.getElementById('c1'), c2 = document.getElementById('c2'), stageSel = document.getElementById('stageSel');
CHARS.forEach((c, i) => { const label = c.name + ' - ' + c.style; c1.add(new Option(label, i)); c2.add(new Option(label, i)); });
c2.options[1].selected = true;
STAGES.forEach((s, i) => stageSel.add(new Option(s, i)));
const rosterPreview = document.getElementById('rosterPreview');
function renderPreview() {
  rosterPreview.innerHTML = CHARS.map((c, i) => {
    const cls = [i === +c1.value ? 'sel1' : '', i === +c2.value ? 'sel2' : ''].filter(Boolean).join(' ');
    return '<div class="fcard ' + cls + '"><div class="fdot" style="background:' + c.color + '"></div>' +
      '<div class="fname">' + c.name + '</div><div class="fstyle">' + c.style + '</div></div>';
  }).join('');
}
c1.addEventListener('change', renderPreview);
c2.addEventListener('change', renderPreview);
renderPreview();

function toast(txt, ms) {
  const el = document.getElementById('toast');
  el.textContent = txt; el.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = 'none'; }, ms || 2200);
}

class Fighter {
  constructor(side, charIndex) {
    this.side = side;
    this.setChar(charIndex);
    this.prev = { lp: false, hp: false, lk: false, hk: false, sp: false, up: false };
    this.reset();
  }
  setChar(i) { this.charIndex = i; this.char = CHARS[i]; }
  reset() {
    this.x = this.side === 0 ? 265 : 695; this.y = GROUND;
    this.vx = 0; this.vy = 0; this.facing = this.side === 0 ? 1 : -1;
    this.hp = 100; this.meter = 0; this.onGround = true;
    this.crouching = false; this.blocking = false; this.attack = null;
    this.hitstun = 0; this.flash = 0; this.state = 'idle'; this.koTime = 0;
    this.combo = 0; this.comboTimer = 0;
    this.prev.lp = this.prev.hp = this.prev.lk = this.prev.hk = this.prev.sp = this.prev.up = false;
    this.tx = this.x; this.ty = this.y;
  }
  startAttack(type) {
    const data = Object.assign({}, A[type]);
    const dm = this.char.durMod || 1;
    data.dur = Math.round(data.dur * dm);
    data.start = Math.max(1, Math.round(data.start * dm));
    data.end = Math.max(data.start, Math.min(data.dur - 1, Math.round(data.end * dm)));
    if (type === 'upper') Object.assign(data, this.char.upper);
    if (type === 'dive') Object.assign(data, this.char.dive);
    if (type === 'rush') Object.assign(data, this.char.rush);
    if (type === 'launcher') Object.assign(data, this.char.launcher);
    this.attack = { type, frame: 0, hit: false, data };
    if (type === 'upper') { this.vy = -11; this.onGround = false; }
    if (type === 'dive') { this.vy = 7; this.onGround = false; }
    if (type === 'rush') this.vx = this.facing * (this.char.rush.speed || 8);
    if (type === 'launcher') { this.vy = -12; this.onGround = false; }
    sfx(type === 'lp' || type === 'lk' || type === 'clp' ? 'lp' : 'hp');
  }
  canCancel() { return this.attack && this.attack.hit && this.attack.data.cancel; }
  applyPhysics() {
    this.x += this.vx; this.y += this.vy;
    if (!this.onGround) {
      this.vy += .72;
      if (this.y >= GROUND) {
        const impact = this.vy;
        this.y = GROUND; this.vy = 0; this.onGround = true;
        if (impact > 3) {
          for (let i = 0; i < 7; i++) {
            particles.push({ x: this.x + (Math.random() - .5) * 30, y: GROUND - 2,
              vx: (Math.random() - .5) * 4, vy: -Math.random() * 2.5,
              life: 14 + Math.random() * 8, color: '#c9b59b', size: 2 + Math.random() * 3 });
          }
        }
      }
    }
    this.x = Math.max(46, Math.min(W - 46, this.x));
  }
  takeHit(a, attacker, local) {
    const inv = this.attack && this.attack.data.invuln && this.attack.frame <= this.attack.data.invuln;
    if (inv && !a.special) return false;
    const dmg = Math.round(a.dmg * (attacker.char ? attacker.char.power : 1));
    if (this.blocking && this.onGround) {
      this.hp = Math.max(0, this.hp - Math.max(1, Math.round(dmg * .2)));
      this.meter = Math.min(100, this.meter + 4);
      this.vx = attacker.facing * 2;
      this.flash = 4;
      fxHit(this.x - this.facing * 18, this.y - 80, '#9cf', 0, 'block');
      sfx('block');
      return true;
    }
    this.hp = Math.max(0, this.hp - dmg);
    this.meter = Math.min(100, this.meter + 5);
    if (attacker.meter !== undefined) attacker.meter = Math.min(100, attacker.meter + 9);
    this.hitstun = a.stun; this.vx = attacker.facing * a.kb;
    if (!this.onGround) this.vy = -5;
    this.flash = 8; this.attack = null; this.combo = 0;
    if (a.knock && this.onGround) this.vy = -6;
    hitstop = 5; shake = 9;
    fxHit(this.x, this.y - 85, '#ffdd55', dmg, 'hit');
    sfx(a.special ? 'special' : 'hit');
    if (this.hp <= 0) { this.state = 'ko'; this.hitstun = 0; this.koTime = 0; sfx('ko'); }
    return true;
  }
  update(inp, opp, local) {
    if (this.state === 'ko') { if (this.koTime < 40) this.koTime++; this.vx *= .85; this.applyPhysics(); return; }
    if (this.flash > 0) this.flash--;
    if (this.comboTimer > 0) { this.comboTimer--; if (this.comboTimer === 0) this.combo = 0; }
    if (!this.attack && this.hitstun <= 0 && this.onGround) this.facing = opp.x >= this.x ? 1 : -1;
    const away = this.facing === 1 ? inp.left : inp.right;
    this.crouching = !!inp.down && this.onGround && !this.attack && this.hitstun <= 0;
    this.blocking = !!away && this.onGround && this.hitstun <= 0 && !this.attack;

    if (this.hitstun > 0) {
      this.hitstun--; this.vx *= .88; this.applyPhysics();
    } else if (this.attack) {
      const a = this.attack.data;
      if (this.canCancel()) {
        const next = pickAttack(inp, this, true);
        if (next) {
          if (next === 'rush' || next === 'launcher') this.meter -= 20;
          this.attack = null; this.startAttack(next);
        }
      }
      if (this.attack) {
        this.attack.frame++;
        const f = this.attack.frame;
        if (f >= a.start && f <= a.end && !this.attack.hit) {
          const hx = this.x + this.facing * a.reach * .5;
          const hw = a.reach * .62;
          const lowHit = !!a.low;
          const hy = this.y - (lowHit ? 42 : a.air ? 78 : 96);
          const hh = lowHit ? 48 : 100;
          const ox = opp.x;
          const oy = opp.y - (opp.crouching ? 42 : 72);
          const oh = opp.crouching ? 84 : 144;
          const vert = a.low ? Math.abs(hy - (opp.y - 28)) < 52 : Math.abs(hy - oy) < hh / 2 + oh / 2;
          if (Math.abs(hx - ox) < hw + 31 && vert) {
            this.attack.hit = true;
            const didHit = opp.takeHit(a, this, local);
            if (didHit) { this.combo++; this.comboTimer = 75; }
          }
        }

  }
  if (phase === 'ko') {
    const idle = { left: false, right: false, up: false, down: false, lp: false, hp: false, lk: false, hk: false, sp: false };
    p.update(idle, e, mode !== 'online'); e.update(idle, p, mode !== 'online');
    updateEffects(); phaseTimer--;
    if (phaseTimer <= 0) {
      if (winsP >= 2 || winsE >= 2) { phase = 'over'; phaseTimer = 240; msg = winsP > winsE ? 'YOU WIN!' : 'YOU LOSE!'; }
      else { round++; resetRound(); }
    }
    return;
  }
  if (hitstop > 0) { hitstop--; return; }
  timeLeft -= 1 / 60;
  const pInp = playerInput(0);
  let eInp;
  if (mode === 'solo') {
    e.oppAttack = !!p.attack; e.oppAir = !p.onGround;
    eInp = aiBrain(e, p);
  } else if (mode === 'online') {
    eInp = netInput || { left: false, right: false, up: false, down: false, lp: false, hp: false, lk: false, hk: false, sp: false };
  } else {
    eInp = playerInput(1);
  }
  p.update(pInp, e, mode !== 'online');
  e.update(eInp, p, mode !== 'online');
  const gap = e.x - p.x;
  if (Math.abs(gap) < 62) {
    const push = (62 - Math.abs(gap)) / 2, s = gap >= 0 ? 1 : -1;
    p.x = Math.max(46, Math.min(W - 46, p.x - push * s));
    e.x = Math.max(46, Math.min(W - 46, e.x + push * s));
  }
  for (const fb of fireballs) {
    fb.x += fb.vx; fb.life--;
    const target = fb.owner === p ? e : p;
    if (Math.abs(fb.x - target.x) < 38 && Math.abs(fb.y - (target.y - 80)) < 80) {
      target.takeHit({ dmg: fb.dmg, stun: 22, kb: 6, pitch: 110, special: true }, fb.owner, mode !== 'online');
      fb.life = 0;
    }
    if (fb.x < 20 || fb.x > W - 20) fb.life = 0;
  }
  fireballs = fireballs.filter(f => f.life > 0);
  updateEffects();
  if (p.hp <= 0 || e.hp <= 0) endRound(true);
  else if (timeLeft <= 0) { timeLeft = 0; endRound(false); }
  if (mode === 'online' && isHost && frameCount % 3 === 0 && conn && conn.open) {
    send({
      type: 'snap', phase, phaseTimer, msg, timeLeft, winsP, winsE, round, ping: netPing,
      s: [snapshotSide(p), snapshotSide(e)],
      fb: fireballs.map(b => ({ x: b.x, y: b.y, vx: b.vx, dmg: b.dmg, life: b.life, r: b.r, color: b.color, side: b.owner.side })),
      ev: netEvents
    });
    netEvents = [];
  }
}

function drawBackground() {
  const st = +stageSel.value;
  let top, mid, bot, groundA, groundB;
  if (st === 0) { top = '#2a1750'; mid = '#a43d6a'; bot = '#f5a35c'; groundA = '#3a2b32'; groundB = '#57404a'; }
  else if (st === 1) { top = '#080d2a'; mid = '#3a1a6b'; bot = '#c02b8a'; groundA = '#141428'; groundB = '#2b2b52'; }
  else { top = '#0c3242'; mid = '#1d7a78'; bot = '#f0c47a'; groundA = '#3b3226'; groundB = '#6b5a3c'; }
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, top); g.addColorStop(.55, mid); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
  if (st === 0 || st === 2) {
    ctx.fillStyle = st === 0 ? 'rgba(255,220,190,.13)' : 'rgba(255,255,255,.09)';
    for (let i = 0; i < 5; i++) {
      const cx = ((frameCount * .18 + i * 260) % (W + 200)) - 100;
      const cy = 95 + (i % 3) * 58;
      ctx.beginPath(); ctx.ellipse(cx, cy, 68, 17, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + 44, cy - 10, 42, 14, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (st === 0) {
    const sunGlow = ctx.createRadialGradient(W / 2, 210, 10, W / 2, 210, 130);
    sunGlow.addColorStop(0, 'rgba(255,217,120,.55)'); sunGlow.addColorStop(1, 'rgba(255,217,120,0)');
    ctx.fillStyle = sunGlow; ctx.fillRect(W / 2 - 130, 80, 260, 260);
    ctx.fillStyle = '#ffd978'; ctx.beginPath(); ctx.arc(W / 2, 210, 78, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b2d55'; ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(0, 320); ctx.lineTo(130, 200); ctx.lineTo(250, 330); ctx.lineTo(360, 240); ctx.lineTo(500, GROUND); ctx.fill();
    ctx.fillStyle = '#4a2145'; ctx.beginPath(); ctx.moveTo(420, GROUND); ctx.lineTo(600, 250); ctx.lineTo(700, 350); ctx.lineTo(820, 220); ctx.lineTo(960, 330); ctx.lineTo(960, GROUND); ctx.fill();
  } else if (st === 1) {
    for (let i = 0; i < 14; i++) {
      const bw = 60 + (i * 37) % 50, bx = i * 72 - 20, bh = 120 + (i * 53) % 180;
      ctx.fillStyle = i % 2 ? '#151540' : '#1e1e58'; ctx.fillRect(bx, GROUND - bh, bw, bh);
      const lit = (Math.floor(frameCount / 12) + i) % 5 !== 0;
      ctx.fillStyle = lit ? (i % 3 ? '#ff5ac8' : '#5af0ff') : '#2a2a55';
      for (let wy = GROUND - bh + 14; wy < GROUND - 20; wy += 26) {
        ctx.globalAlpha = ((Math.floor(wy / 26) + i) % 4 === 0 && !lit) ? .2 : 1;
        ctx.fillRect(bx + 10, wy, 6, 8);
      }
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = 'rgba(255,90,200,' + (.14 + .08 * Math.sin(frameCount / 10)) + ')'; ctx.fillRect(0, 300, W, 6);
  } else {
    ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(W / 2, 190, 62, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#14555c'; ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(120, 260); ctx.lineTo(260, 360); ctx.lineTo(420, 230); ctx.lineTo(600, GROUND); ctx.fill();
    ctx.fillStyle = '#0d444b'; ctx.beginPath(); ctx.moveTo(400, GROUND); ctx.lineTo(620, 250); ctx.lineTo(780, 350); ctx.lineTo(960, 240); ctx.lineTo(960, GROUND); ctx.fill();
    for (let i = 0; i < 6; i++) {
      const lx = 90 + i * 150, pulse = 1 + .12 * Math.sin(frameCount / 9 + i);
      const glow = ctx.createRadialGradient(lx, 260, 4, lx, 260, 44);
      glow.addColorStop(0, 'rgba(255,150,80,.35)'); glow.addColorStop(1, 'rgba(255,150,80,0)');
      ctx.fillStyle = glow; ctx.fillRect(lx - 44, 216, 88, 88);
      ctx.fillStyle = '#e94b3c'; ctx.beginPath(); ctx.ellipse(lx, 260, 14 * pulse, 20 * pulse, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd36b'; ctx.fillRect(lx - 2, 280, 4, 16);
    }
  }
  for (let i = 0; i < 40; i++) {
    const x = i * 25 + 6, y = GROUND - 8 - (i % 3) * 4 + Math.sin(frameCount / 14 + i * .8) * 2;
    ctx.fillStyle = i % 5 === 0 ? 'rgba(255,180,120,.28)' : 'rgba(20,10,30,.5)';
    ctx.beginPath(); ctx.arc(x, y - 18, 9, Math.PI, 0); ctx.fill(); ctx.fillRect(x - 9, y - 18, 18, 18);
  }
  ctx.fillStyle = groundA; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = groundB; ctx.fillRect(0, GROUND, W, 6);
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2;
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(i * 130, GROUND + 30); ctx.lineTo(i * 130 + 70, H); ctx.stroke(); }
}
function drawForeground() {
  const st = +stageSel.value;
  ctx.save();
  if (st === 0) {
    ctx.fillStyle = 'rgba(18,12,22,.78)';
    ctx.fillRect(0, 492, W, 7);
    for (let i = 0; i < 15; i++) ctx.fillRect(i * 68 + 8, 490 + (i % 2) * 4, 6, H - 490);
  } else if (st === 1) {
    const flick = .45 + .2 * Math.sin(frameCount / 7);
    ctx.fillStyle = 'rgba(6,6,24,.82)'; ctx.fillRect(0, 506, W, H - 506);
    ctx.fillStyle = 'rgba(90,240,255,' + flick + ')'; ctx.fillRect(16, 470, 116, 6); ctx.fillRect(W - 132, 462, 116, 6);
    ctx.fillStyle = 'rgba(255,90,200,' + flick + ')'; ctx.fillRect(16, 482, 82, 4); ctx.fillRect(W - 98, 474, 82, 4);
  } else {
    ctx.fillStyle = 'rgba(70,45,28,.9)';
    ctx.fillRect(0, 434, 30, H - 434); ctx.fillRect(W - 30, 434, 30, H - 434);
    ctx.fillStyle = 'rgba(255,205,130,' + (.2 + .08 * Math.sin(frameCount / 10)) + ')';
    ctx.fillRect(24, 448, 8, 60); ctx.fillRect(W - 32, 448, 8, 60);
  }
  ctx.restore();
}

function drawFighter(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, 3, 40, 9, 0, 0, Math.PI * 2); ctx.fill();
  if (f.state === 'ko') {
    const t = Math.min(1, f.koTime / 18);
    ctx.rotate(-f.facing * (Math.PI / 2) * t); ctx.translate(0, -t * 12);
  }
  ctx.scale(f.facing, 1);
  const flash = f.flash > 0 && Math.floor(f.flash / 2) % 2 === 0;
  const C = col => flash ? '#ffffff' : col;
  const build = f.char.build || 1;
  const bw = 20 * build;
  const limbW = 15 * build;
  const crouch = f.crouching ? 1 : 0;
  const bob = f.state === 'walk' ? Math.sin(frameCount / 5) * 2.5 : f.state === 'idle' ? Math.sin(frameCount / 18) * 1.2 : 0;
  const walkLeg = f.state === 'walk' ? Math.sin(frameCount / 5) * 12 : 0;
  const hipY = -60 + crouch * 22 + bob;
  const shoulderY = hipY - 42;
  const headY = -116 + crouch * 30 + bob;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = C('#2b2b38'); ctx.lineWidth = limbW;
  ctx.beginPath(); ctx.moveTo(-9 * build, hipY); ctx.lineTo(-14 * build - walkLeg * .5, hipY / 2); ctx.lineTo(-16 * build - walkLeg, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9 * build, hipY); ctx.lineTo(14 * build + walkLeg * .5, hipY / 2); ctx.lineTo(16 * build + walkLeg, -2); ctx.stroke();
  ctx.fillStyle = C('#f0f0f0');
  ctx.fillRect(-25 * build - walkLeg, -8, 18 * build, 8); ctx.fillRect(9 * build + walkLeg, -8, 18 * build, 8);
  ctx.fillStyle = C(f.char.color);
  ctx.beginPath(); ctx.moveTo(-bw, shoulderY); ctx.lineTo(bw, shoulderY); ctx.lineTo(bw + 4, hipY + 4); ctx.lineTo(-bw - 4, hipY + 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C(f.char.trim || '#ffffff'); ctx.fillRect(-bw - 4, hipY - 8, (bw + 4) * 2, 10);
  ctx.fillStyle = C('#111'); ctx.fillRect(-5, hipY - 9, 10, 12);
  ctx.fillStyle = C(f.char.color);
  ctx.beginPath(); ctx.moveTo(-bw, shoulderY); ctx.lineTo(-6, shoulderY + 26); ctx.lineTo(6, shoulderY + 26); ctx.lineTo(bw, shoulderY); ctx.fill();
  let hx = 20 + (f.charIndex === 1 ? 7 : 0), hy = shoulderY + 16 - (f.charIndex === 1 ? 7 : 0);
  let ext = 0;
  if (f.attack) {
    const a = f.attack.data, fr = f.attack.frame;
    if (fr < a.start) ext = fr / a.start;
    else if (fr <= a.end) ext = 1;
    else ext = Math.max(0, 1 - (fr - a.end) / Math.max(1, a.dur - a.end));
    if (f.attack.type === 'upper') { hx = 14; hy = shoulderY - 56 * ext; }
    else { hx = 20 + ext * a.reach * .85; hy = shoulderY + 10 + ext * (a.air ? 22 : a.low ? 26 : -6); }
    if (ext > .05) {
      ctx.save();
      ctx.globalAlpha = .22 + ext * .48;
      ctx.strokeStyle = C(f.char.color);
      ctx.lineWidth = (f.charIndex === 2 ? 14 : 9) * ext;
      ctx.beginPath();
      const a = f.attack.data;
      if (f.attack.type === 'upper') ctx.arc(12, shoulderY - 22, a.reach * .55, -1.5, .45);
      else if (f.attack.type === 'launcher') ctx.arc(12, shoulderY - 34, a.reach * .7, -1.6, .5);
      else if (f.attack.type === 'rush') ctx.arc(10, shoulderY + 8, a.reach * .85, -.75, .7);
      else if (f.attack.type === 'dive') ctx.arc(14, shoulderY + 26, a.reach * .6, -1.1, .8);
      else ctx.arc(10, shoulderY + (a.low ? 22 : a.air ? 18 : 8), a.reach * .72, -.95, .85);
      ctx.stroke();
      ctx.restore();
    }
  }
  if (f.blocking) { hx = 27; hy = shoulderY + 4; }
  if (f.victory && (phase === 'ko' || phase === 'over')) { hx = 30; hy = shoulderY - 62; }
  ctx.strokeStyle = C(f.char.color); ctx.lineWidth = 12 * build;
  ctx.beginPath(); ctx.moveTo(-bw + 4, shoulderY + 6); ctx.lineTo(-bw - 6, shoulderY + 26); ctx.lineTo(f.blocking ? 14 : -6, shoulderY + (f.blocking ? 8 : 34)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bw - 4, shoulderY + 6); ctx.lineTo((hx + bw - 4) / 2, shoulderY + 2); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = C('#e8b48a'); ctx.beginPath(); ctx.arc(hx, hy, 9 * build, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C('#e8b48a'); ctx.beginPath(); ctx.arc(0, headY, 17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C('#201820'); ctx.beginPath(); ctx.arc(0, headY - 4, 17, Math.PI, Math.PI * 2); ctx.fill(); ctx.fillRect(-17, headY - 6, 7, 12);
  ctx.fillStyle = C('#111'); ctx.fillRect(4, headY - 2, 6, 3);
  ctx.strokeStyle = C('#a33'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(6, headY + 9); ctx.lineTo(13, headY + 8); ctx.stroke();
  if (f.charIndex === 3) {
    ctx.fillStyle = C('#15151c'); ctx.fillRect(-17, headY - 11, 34, 6);
    ctx.strokeStyle = C(f.char.trim || '#fff3bf'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-15, headY - 10); ctx.lineTo(-38, headY - 16 + Math.sin(frameCount / 5) * 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-15, headY - 6); ctx.lineTo(-33, headY + 1 + Math.sin(frameCount / 5 + 1) * 4); ctx.stroke();
  }
  if (f.charIndex === 4) {
    ctx.fillStyle = C('#d8d8e0');
    ctx.beginPath(); ctx.moveTo(-bw - 2, shoulderY + 4); ctx.lineTo(-bw - 20, shoulderY - 12); ctx.lineTo(-bw - 4, shoulderY + 14); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bw + 2, shoulderY + 4); ctx.lineTo(bw + 20, shoulderY - 12); ctx.lineTo(bw + 4, shoulderY + 14); ctx.fill();
    ctx.fillStyle = C('#ff5ac8'); ctx.fillRect(4, headY - 2, 6, 3);
  }
  if (f.meter >= 100) {
    ctx.fillStyle = 'rgba(255,220,80,' + (.3 + .25 * Math.sin(frameCount / 6)) + ')';
    ctx.beginPath(); ctx.arc(0, headY - 22, 22, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBar(x, y, w, h, val, max, color, flip) {
  ctx.fillStyle = '#111'; ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  ctx.fillStyle = '#444'; ctx.fillRect(x, y, w, h);
  const fw = Math.max(0, Math.min(1, val / max)) * w;
  ctx.fillStyle = color; ctx.fillRect(flip ? x + w - fw : x, y, fw, h);
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function portrait(x, y, f) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.arc(x, y, 23, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = f.char.color; ctx.beginPath(); ctx.arc(x, y, 19, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.beginPath(); ctx.arc(x - 6, y - 7, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 17px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(f.char.name[0], x, y + 1);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}
function drawHUD() {
  rr(16, 12, 432, 62, 10); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,204,68,.45)'; ctx.lineWidth = 2; ctx.stroke();
  rr(W - 448, 12, 432, 62, 10); ctx.fill(); ctx.stroke();
  const lowPulse = Math.floor(frameCount / 6) % 2 === 0 ? '#ff3b3b' : '#ff9a3b';
  const hpColor = hp => hp > 30 ? '#4ade80' : lowPulse;
  drawBar(70, 36, 340, 20, pDelay, 100, '#fde68a', false);
  drawBar(70, 36, 340, 20, p.hp, 100, hpColor(p.hp), false);
  drawBar(W - 410, 36, 340, 20, eDelay, 100, '#fde68a', true);
  drawBar(W - 410, 36, 340, 20, e.hp, 100, hpColor(e.hp), true);
  drawBar(70, 61, 260, 8, p.meter, 100, '#fbbf24', false);
  drawBar(W - 330, 61, 260, 8, e.meter, 100, '#fbbf24', true);
  portrait(42, 43, p); portrait(W - 42, 43, e);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'left';
  ctx.fillText(p.char.name + ' (P1)', 72, 30);
  ctx.textAlign = 'right'; ctx.fillText(e.char.name + ' (P2)', W - 72, 30);
  ctx.font = 'bold 10px Arial'; ctx.fillStyle = '#ffcc44';
  ctx.textAlign = 'left'; ctx.fillText(p.char.style, 74, 78);
  ctx.textAlign = 'right'; ctx.fillText(e.char.style, W - 74, 78);
  ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.font = 'bold 46px Arial';
  const t = String(Math.max(0, Math.ceil(timeLeft))).padStart(2, '0');
  ctx.fillText(t, W / 2 + 2, 62); ctx.fillStyle = '#ffcc44'; ctx.fillText(t, W / 2, 60);
  for (let i = 0; i < 2; i++) {
    ctx.fillStyle = i < winsP ? '#ffcc44' : '#444'; ctx.beginPath(); ctx.arc(W / 2 - 90 - i * 26, 40, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = i < winsE ? '#ffcc44' : '#444'; ctx.beginPath(); ctx.arc(W / 2 + 90 + i * 26, 40, 9, 0, Math.PI * 2); ctx.fill();
  }
  if (mode === 'online') {
    ctx.textAlign = 'center'; ctx.font = 'bold 12px Arial'; ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillText((isHost ? 'HOST' : 'GUEST') + '  ' + netPing + 'ms', W / 2, 86);
  }
  if (p.combo > 1) { ctx.textAlign = 'left'; ctx.fillStyle = '#ffd84d'; ctx.font = 'bold 22px Arial'; ctx.fillText(p.combo + ' HIT COMBO!', 34, 104); }
  if (e.combo > 1) { ctx.textAlign = 'right'; ctx.fillStyle = '#ffd84d'; ctx.font = 'bold 22px Arial'; ctx.fillText(e.combo + ' HIT COMBO!', W - 34, 104); }
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawBackground();
  for (const fb of fireballs) {
    const pulse = 1 + .12 * Math.sin(frameCount / 3);
    ctx.fillStyle = 'rgba(120,180,255,.35)'; ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r * 1.7 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fb.color || '#6cf'; ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#eef'; ctx.beginPath(); ctx.arc(fb.x - 3, fb.y - 4, fb.r * .45, 0, Math.PI * 2); ctx.fill();
  }
  [p, e].sort((a, b) => a.y - b.y).forEach(drawFighter);
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.life / 14);
    ctx.strokeStyle = '#fff8c0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  }
  for (const q of particles) { ctx.globalAlpha = Math.min(1, q.life / 10); ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, q.size, q.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = 'bold 22px Arial';
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life / 15); ctx.fillStyle = '#000'; ctx.fillText(t.text, t.x + 2, t.y + 2); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y); }
  ctx.globalAlpha = 1;
  drawForeground();
  ctx.restore();
  const vig = ctx.createRadialGradient(W / 2, H / 2, 140, W / 2, H / 2, 620);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.025)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  if (screenFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (screenFlash / 6 * .18) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (phase !== 'menu') {
    drawHUD();
    if (msg) {
      ctx.textAlign = 'center'; ctx.font = 'bold 64px Arial'; ctx.lineWidth = 8; ctx.strokeStyle = '#000';
      ctx.strokeText(msg, W / 2, H / 2 - 20);
      ctx.fillStyle = msg === 'YOU WIN!' ? '#ffd84d' : msg === 'YOU LOSE!' ? '#ff6b6b' : '#fff';
      ctx.fillText(msg, W / 2, H / 2 - 20);
      if (phase === 'over') { ctx.font = 'bold 22px Arial'; ctx.fillStyle = '#fff'; ctx.fillText('PRESS ANY KEY OR BUTTON TO REMATCH', W / 2, H / 2 + 32); }
    }
  }
}

p = new Fighter(0, +c1.value);
e = new Fighter(1, +c2.value);
p.ai = { timer: 0, action: 'idle', block: 0, move: 'lp' };
e.ai = { timer: 0, action: 'idle', block: 0, move: 'lp' };
showMenu();

function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = ts - lastTime; lastTime = ts;
  accumulator += Math.min(dt, 100);
  let steps = 0;
  while (accumulator >= 16.6667 && steps < 6) { update(); accumulator -= 16.6667; steps++; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
